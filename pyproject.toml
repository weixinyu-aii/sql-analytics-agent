[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sql-analytics-agent"
version = "0.1.0"
description = "多步骤 Text2SQL 智能数据分析 Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.36,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "sqlglot>=25.0,<100.0",
  "streamlit>=1.57,<2.0",
  "pandas>=2.2,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pymysql>=1.1,<2.0",
  "cryptography>=43.0,<50.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
analytics-api = "sql_agent.main:run"
analytics-seed = "scripts.seed_database:main"

[tool.hatch.build.targets.wheel]
packages = ["sql_agent", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]



